<!doctype html>
<html><head><meta charset="utf-8"><title>demo</title></head>
<body style="font-family: Segoe UI; background: #2b2b2b; color: #eee">
<div id="log">demo page</div>
<script>
  const log = (t) => (document.getElementById("log").textContent += " | " + t);
  const wv = window.chrome && window.chrome.webview;
  log("webview=" + !!wv);
  if (wv) {
    wv.addEventListener("message", (e) => log("got " + JSON.stringify(e.data)));
    wv.postMessage({ cmd: "ready", data: "" });
    log("posted");
  }
</script>
</body></html>
