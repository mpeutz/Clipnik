<section data-title="Action Mode" data-keywords="reference action mode ring ctrl shift a">
  <h1>Action Mode</h1>
  <p>Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> to open the action ring. Release the held key over a
    wedge, click one, or press its letter. Digits <kbd>0</kbd> to <kbd>9</kbd> switch channel and <kbd>D</kbd>
    disables Clipnik; both are keyboard only.</p>
  <div data-ref="actions"></div>
</section>
