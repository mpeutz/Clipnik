  <h1>Formats</h1>
  <p>In paste mode press <kbd>Z</kbd> to open the format ring and pick how the clip is pasted. Formats that
    suit the clip come first; the rest are dimmed but still usable. The choice lasts until you change it, or
    until the next copy when "revert format" is on in Settings.</p>
