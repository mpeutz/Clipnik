<!doctype html>
<html class="dark">
<head>
  <meta charset="utf-8">
  <title>Channel Organizer</title>
  <link rel="stylesheet" href="../common/theme.css">
  <script src="../common/util.js"></script>
  <script src="../common/bridge.js"></script>
  <style>
    #hdr, #rows .tr { grid-template-columns: 34px minmax(0, 1fr) 150px; }
    .channels { width: 220px; flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
    .channels .head { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 8px 0 12px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
    .channels .list { flex-grow: 1; overflow: auto; outline: 0; }
    .ch { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; cursor: default; white-space: nowrap; }
    .ch .n { color: var(--muted); font-size: 12px; width: 18px; flex: 0 0 auto; }
    .ch .name { overflow: hidden; text-overflow: ellipsis; }
    .ch .cnt { margin-left: auto; color: var(--muted); font-size: 11.5px; }
    .ch.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
    .ch:hover { background: var(--hover); }
    .ch.active .name::after { content: "●"; color: var(--accent); font-size: 8px; margin-left: 6px; vertical-align: middle; }
    .ch.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .channels .foot { padding: 8px 12px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); }
    .props { padding: 8px 14px 10px 14px; display: flex; gap: 8px; align-items: center; }
    .props .edit { width: auto; flex-grow: 1; }
    .toolbar .sel { display: flex; align-items: center; gap: 8px; margin-left: 12px; }
    .toolbar select.edit { width: 170px; }
    .toolbar .search { max-width: 280px; margin-left: auto; }
    .card .radio { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 16px; cursor: pointer; }
    .card .radio input { appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid var(--muted); border-radius: 50%; background: var(--surfaceAlt); display: inline-grid; place-content: center; }
    .card .radio input:checked { border-color: var(--accent); }
    .card .radio input:checked::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .card .list { max-height: 260px; overflow: auto; }
    .card .newch { color: var(--accent); }
  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button class="btn primary" id="newClip" data-i18n="ORG_NewClip">New clip</button>
    <button class="btn" id="newChannel" data-i18n="ORG_newChannel">New channel</button>
    <div class="sel"><span class="dim" data-i18n="ORG_chooseCh">Active channel</span><select class="edit" id="active"></select></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search clips">
    </div>
  </div>
  <div class="split">
    <div class="channels">
      <div class="head"><span data-i18n="ORG_channels">Channels</span><button class="iconbtn" id="addChannel" title="New channel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
      <div class="list" id="channels" tabindex="0"></div>
      <div class="foot" id="chfoot" data-i18n="ORG_footHint">Double-click to use · F2 renames · Drag clips here to move</div>
    </div>
    <div class="pane">
      <div class="table" id="table" tabindex="0">
        <div class="hdr" id="hdr"><span>#</span><span data-i18n="ORG_clip">Clip</span><span data-i18n="ORG_tags">Tags</span></div>
        <div id="rows"></div>
      </div>
    </div>
    <div class="preview" style="width: 320px;">
      <div class="ph" id="ph"><span class="dim" data-i18n="ORG_selectHint">Select a clip</span><span style="margin-left: auto; display: inline-flex; gap: 2px;"><button class="iconbtn" id="up" title="Move up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button><button class="iconbtn" id="down" title="Move down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button></span></div>
      <div class="body mono" id="body"></div>
      <div class="props" id="props" hidden><span class="dim" data-i18n="ORG_tags">Tags</span><input class="edit" id="tags" type="text" spellcheck="false"><label class="check"><input type="checkbox" id="fixed"><span data-i18n="ORG_fixed">Fixed</span></label></div>
      <div class="actions">
        <button class="btn primary" data-act="paste"><span data-i18n="ORG_insta">Insta-Paste</span><kbd>Space</kbd></button>
        <button class="btn" data-act="pasteMode"><span data-i18n="ORG_openPst">Paste mode</span><kbd>Ctrl+O</kbd></button>
        <button class="btn" data-act="edit"><span data-i18n="ORG_editBtn">Edit</span><kbd>F2</kbd></button>
        <button class="btn" data-act="moveTo"><span data-i18n="ORG_moveTo">Move to…</span><kbd>Alt+X</kbd></button>
        <button class="btn" data-act="copyTo"><span data-i18n="ORG_copyTo">Copy to…</span><kbd>Alt+C</kbd></button>
        <button class="btn" data-act="delete"><span data-i18n="ORG_delete">Delete</span><kbd>Del</kbd></button>
      </div>
    </div>
    <div class="sheet" id="sheet" hidden></div>
  </div>
  <div class="status"><span id="count"></span><span class="right" id="chstatus"></span></div>
</div>
<script src="app.js"></script>
</body>
</html>
