<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 13.33px; line-height: 1.35; }
    a { color: var(--accent); } a:hover { color: var(--accent); text-decoration: underline; }
    .win { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
    .title { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 0 0 12px; font-size: 12px; }
    .title .caption { flex-grow: 1; }
    .title .wc { width: 46px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text); }
    .nav { width: 168px; flex: 0 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav .item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 4px; color: var(--text); position: relative; }
    .nav .item.sel { background: var(--hover); }
    .nav .item.sel::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent); }
    .nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .content { flex: 1 1 0; min-width: 0; background: var(--surface); border-left: 1px solid var(--border); border-top: 1px solid var(--border); border-top-left-radius: 8px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
    .h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px 0; }
    .section { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px 0; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 32px; } .row .lbl { flex: 1 1 0; min-width: 0; } .row > :not(.lbl) { flex: 0 0 auto; }
    .row .lbl { flex-grow: 1; }
    .row .hint { color: var(--muted); font-size: 12px; }
    .check { display: flex; align-items: center; gap: 10px; min-height: 28px; }
    .box { width: 16px; height: 16px; border: 1px solid var(--muted); border-radius: 3px; background: var(--surfaceAlt); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .box.on { background: var(--accent); border-color: var(--accent); }
    .box svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .edit { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surfaceAlt); color: var(--text); display: flex; align-items: center; box-sizing: border-box; }
    .edit.num { width: 80px; justify-content: space-between; }
    .edit.num .spin { display: flex; flex-direction: column; gap: 1px; margin-right: -4px; color: var(--muted); }
    .edit.num .spin svg { width: 10px; height: 8px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .edit.ddl { width: 180px; justify-content: space-between; }
    .edit.ddl svg { width: 12px; height: 12px; stroke: var(--muted); fill: none; stroke-width: 1.5; }
    .edit.hk { width: 180px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
    .edit.hk.empty { color: var(--muted); font-family: inherit; font-size: 13.33px; }
    .btn { height: 26px; min-width: 76px; padding: 0 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--surfaceAlt); color: var(--text); display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accentText); }
    .btn.dis { opacity: .45; }
    .footer { height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 24px; background: var(--bg); }
    .list { border: 1px solid var(--border); border-radius: 4px; background: var(--surfaceAlt); display: flex; flex-direction: column; overflow: hidden; }
    .list .hdr { display: grid; height: 26px; align-items: center; padding: 0 10px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
    .list .li { display: grid; height: 28px; align-items: center; padding: 0 10px; }
    .list .li.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
    .status { height: 24px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--bg); }
    .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 4px; background: var(--surfaceAlt); }
    .badge.accent { background: var(--accent); color: var(--accentText); }
  
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
    .search { flex-grow: 1; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surfaceAlt); color: var(--muted); }
    .search svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .search .q { color: var(--text); flex-grow: 1; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accentText); }
    .split { display: flex; flex-grow: 1; min-height: 0; border-top: 1px solid var(--border); }
    .pane { display: flex; flex-direction: column; min-width: 0; }
    .table { flex-grow: 1; overflow: hidden; }
    .table .hdr { display: grid; gap: 12px; height: 28px; align-items: center; padding: 0 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; }
    .table .tr { display: grid; gap: 12px; height: 30px; align-items: center; padding: 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); white-space: nowrap; }
    .table .tr > span { overflow: hidden; text-overflow: ellipsis; }
    .table .tr.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
    .table .tr:hover { background: var(--hover); }
    .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
    .dim { color: var(--muted); }
    .preview { width: 380px; flex: 0 0 auto; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; }
    .preview .ph { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .preview .body { flex-grow: 1; padding: 12px 14px; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
    .preview .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg); }
    .abtn { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surfaceAlt); color: var(--text); }
    .abtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accentText); }
    .abtn kbd { font-family: inherit; font-size: 10.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
    .abtn.primary kbd { color: var(--accentText); background: transparent; border-color: rgba(255,255,255,.4); }
    mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; }
    .channels { width: 220px; flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; }
    .channels .ch { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; }
    .channels .ch.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
    .channels .ch .n { color: var(--muted); font-size: 12px; width: 18px; }
    .channels .ch .cnt { margin-left: auto; color: var(--muted); font-size: 11.5px; }
    .channels .head { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .iconbtn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--muted); }
    .iconbtn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sheet { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
    .card { width: 360px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.4); display: flex; flex-direction: column; }
    .card .ch { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; }
    .card .ch.sel { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
    .card .h { padding: 12px 16px 6px 16px; font-weight: 600; }
    .card .footer { border-radius: 0 0 8px 8px; }
  </style>
</helmet>
<div style="display: flex; gap: 32px; align-items: flex-start; padding: 24px; background: var(--bg); color: var(--text); width: 900px; height: 300px; box-sizing: border-box; {{vars}}">
  <div class="card" style="width: 420px;">
    <div class="h">Delete channel 2 - Snippets</div>
    <div style="padding: 0 16px 8px 16px;" class="dim">27 clips are in this channel. What should happen to them?</div>
    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 6px;">
      <div class="ch sel" style="height: 32px; border-radius: 4px;"><span>Move them to another channel</span></div>
      <div class="ch" style="height: 32px;"><span>Delete the clips too</span></div>
    </div>
    <div class="footer" style="height: 52px;"><div class="btn primary" style="height: 26px;">Continue</div><div class="btn" style="height: 26px;">Cancel</div></div>
  </div>
  <div class="card" style="width: 360px;">
    <div class="h">Rename channel 2</div>
    <div style="padding: 0 16px 12px 16px;"><div class="edit" style="height: 24px; width: 328px;"><span>Snippets</span></div></div>
    <div class="footer" style="height: 52px;"><div class="btn primary" style="height: 26px;">Rename</div><div class="btn" style="height: 26px;">Cancel</div></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"accent":{"editor":"color","default":"#C42B1C","options":["#C42B1C","#0078D4","#107C10","#8764B8"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.dark ?? true;
    const p = d ? {"bg":"#202020","surface":"#2B2B2B","surfaceAlt":"#363636","border":"#3F3F3F","text":"#F0F0F0","muted":"#9A9A9A","hover":"#333333"} : {"bg":"#F3F3F3","surface":"#FFFFFF","surfaceAlt":"#EDEDED","border":"#D9D9D9","text":"#1B1B1B","muted":"#6B6B6B","hover":"#E9E9E9"};
    const accent = this.props.accent ?? '#C42B1C';
    const vars = Object.entries(p).map(([k, v]) => '--' + k + ':' + v).join(';') + ';--accent:' + accent + ';--accentText:#FFFFFF';
    return { vars };
  }
}
</script>
</body>
</html>
